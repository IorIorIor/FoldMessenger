name: release

# Push a version tag (git tag v1.8.1 && git push origin v1.8.1) and this
# builds a signed APK and publishes it as a GitHub Release. The app on the
# phones polls the latest release and offers the install.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore signing keystore
        env:
          FM_KEYSTORE_B64: ${{ secrets.FM_KEYSTORE_B64 }}
        run: echo "$FM_KEYSTORE_B64" | base64 -d > foldmessenger-release.keystore

      - name: Build signed release APK
        env:
          FM_KEYSTORE_PASSWORD: ${{ secrets.FM_KEYSTORE_PASSWORD }}
          FM_NTFY_TOKEN: ${{ secrets.FM_NTFY_TOKEN }}
        run: ./gradlew assembleRelease

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/FoldMessenger-v*.apk
