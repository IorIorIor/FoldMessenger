<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Fold Messenger — Sender</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #111; color: #eee; max-width: 560px; margin: 0 auto; padding: 24px 16px;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p.sub { color: #888; font-size: 13px; margin-bottom: 24px; }
  fieldset { border: 1px solid #333; border-radius: 8px; padding: 12px; margin-bottom: 16px; }
  legend { padding: 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: #888; }
  .phones { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .phones label, .all-label {
    display: flex; align-items: center; gap: 6px; background: #1c1c1c;
    border: 1px solid #333; border-radius: 6px; padding: 8px 10px; cursor: pointer;
    font-size: 14px; user-select: none;
  }
  .phones label { flex-wrap: wrap; }
  .phones .num { font-weight: 600; }
  .phones .pname {
    flex-basis: 100%; font-size: 12px; color: #9a9a9a; line-height: 1.2;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .phones label.selected, .all-label.selected {
    background: #2a3a2a; border-color: #4a8a4a;
  }
  .all-label { margin-bottom: 8px; }
  textarea {
    width: 100%; min-height: 80px; background: #1c1c1c; color: #eee;
    border: 1px solid #333; border-radius: 6px; padding: 10px; font-size: 15px; resize: vertical;
  }
  input[type=file] { font-size: 13px; color: #aaa; }
  input#token {
    width: 100%; background: #1c1c1c; color: #eee; border: 1px solid #333;
    border-radius: 6px; padding: 10px; font-size: 15px;
  }
  #tokenState { margin-top: 8px; font-size: 13px; }
  .tables { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tables button {
    width: 100%; padding: 12px 8px; font-size: 15px; font-weight: 600;
    background: #1c1c1c; color: #eee; border: 1px solid #333; border-radius: 6px;
  }
  .tables button.active { background: #2a3a2a; border-color: #4a8a4a; color: #fff; }
  #preview { max-width: 100%; max-height: 200px; margin-top: 10px; border-radius: 6px; display: none; }
  #fileInfo { margin-top: 8px; font-size: 13px; color: #aaa; line-height: 1.5; }
  button {
    width: 100%; padding: 14px; font-size: 16px; font-weight: 600; border: 0;
    border-radius: 8px; background: #fff; color: #111; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button.linkbtn {
    width: auto; margin-top: 10px; padding: 6px 10px; font-size: 13px; font-weight: 500;
    background: transparent; color: #e77; border: 1px solid #633; border-radius: 6px;
  }
  button.secondary {
    margin-top: 12px; background: transparent; color: #e77;
    border: 1px solid #633; font-weight: 500;
  }
  button.accent {
    margin-top: 12px; background: #2440e4; color: #fff;
  }
  #results { font-size: 14px; line-height: 1.6; }
  #results .row {
    display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid #333;
  }
  #results .row:first-child { border-top: 0; }
  #results .who { color: #7c7; font-weight: 600; white-space: nowrap; }
  #results .picks { color: #eee; }
  #results .none { color: #888; font-style: italic; }
  #results .waiting { color: #888; }
  #log { margin-top: 16px; font-size: 13px; line-height: 1.7; color: #aaa; white-space: pre-wrap; }
  .ok { color: #7c7; } .err { color: #e77; }
</style>
</head>
<body>
<h1>📨 Fold Messenger</h1>
<p class="sub">Stuur een vooraf gemaakt secret naar de Fold-telefoons</p>

<fieldset>
  <legend>To</legend>
  <label class="all-label"><input type="checkbox" id="all"> <strong>All phones</strong></label>
  <div class="phones" id="phones"></div>
</fieldset>

<fieldset id="tokenBox">
  <legend>ntfy-token</legend>
  <input type="password" id="token" placeholder="tk_… (eenmalig, blijft in deze browser)">
  <button type="button" id="saveToken" class="linkbtn">Opslaan</button>
  <div id="tokenState"></div>
</fieldset>

<fieldset>
  <legend>Tafel</legend>
  <div class="tables" id="tables"></div>
</fieldset>

<fieldset>
  <legend>Bericht (optioneel)</legend>
  <textarea id="text" placeholder="Tekst bij het secret… (optioneel)"></textarea>
</fieldset>

<fieldset>
  <legend>Secret (afbeelding of video)</legend>
  <input type="file" id="file" accept="image/*,video/*">
  <button type="button" id="clearfile" class="linkbtn" hidden>✕ Remove file</button>
  <div id="fileInfo"></div>
  <img id="preview" alt="">
  <video id="previewvid" controls muted style="max-width:100%;max-height:200px;margin-top:10px;border-radius:6px;display:none"></video>
</fieldset>

<button id="send">Send</button>
<button id="selfies" class="accent">📸 VRAAG SELFIES</button>
<button id="finalq" class="accent">❓ SEND FINAL QUESTION</button>
<button id="nextround" class="secondary">⏭ Next round — clear all phones</button>

<fieldset id="resultsBox" hidden>
  <legend>Antwoorden</legend>
  <div id="results"></div>
</fieldset>
<div id="log"></div>

<script>
// Must match Config.TOPIC_BASE in the Android app.
const TOPIC_BASE = "fm-pw3h5q3z";
const SERVER = "https://ntfy.sh";
const PHONE_COUNT = 6;   // keep in sync with Config.PHONE_COUNT in the app

// The ntfy token lifts the anonymous rate and bandwidth limits. It is kept in
// this browser only — never in the file, because the repo is public.
let ntfyToken = localStorage.getItem("fm_ntfy_token") || "";

function authHeaders(extra = {}) {
  return ntfyToken ? { ...extra, Authorization: `Bearer ${ntfyToken}` } : extra;
}

// Subscriptions can't set headers, so ntfy takes the same value base64url-encoded
// in an `auth` query parameter.
function authQuery() {
  if (!ntfyToken) return "";
  const b64 = btoa(`Bearer ${ntfyToken}`).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  return `?auth=${b64}`;
}

function paintToken() {
  const el = document.getElementById("tokenState");
  el.textContent = ntfyToken ? "✓ token opgeslagen — hogere limieten actief" : "⚠ geen token — anonieme limieten";
  el.className = ntfyToken ? "ok" : "err";
  document.getElementById("token").value = ntfyToken;
}
document.getElementById("saveToken").addEventListener("click", () => {
  ntfyToken = document.getElementById("token").value.trim();
  localStorage.setItem("fm_ntfy_token", ntfyToken);
  paintToken();
  addLog(ntfyToken ? "✓ ntfy-token opgeslagen" : "Token gewist", ntfyToken ? "ok" : "err");
});
paintToken();

// Tables of players, mirroring res/values/tables.xml in the app. Position in a
// table's list is the phone number: the first name is on phone 1.
const TABLES = [
  ["Ferry", "Ferdi", "Bart", "Marieke", "Natascha", "Sam"],
  ["Vanja", "Ali", "Ben", "Femke", "Laura", "Danique"],
  ["Jermaine", "Xander", "Romano", "Jeroen", "Lenny", "Harald"],
];
const TABLE_COUNT = TABLES.length;
let activeTable = Number(localStorage.getItem("fm_table") || 1);

const tablesDiv = document.getElementById("tables");
for (let t = 1; t <= TABLE_COUNT; t++) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = `Tafel ${t}`;
  b.dataset.table = String(t);
  b.addEventListener("click", () => selectTable(t));
  tablesDiv.appendChild(b);
}

function paintTables() {
  if (typeof renderResults === "function" && !document.getElementById("resultsBox").hidden) {
    setTimeout(renderResults, 0);
  }
  document.querySelectorAll("#tables button").forEach(b => {
    b.classList.toggle("active", Number(b.dataset.table) === activeTable);
  });
}

// Tell every phone which table is in play; they look up their own player from it.
async function selectTable(t) {
  activeTable = t;
  localStorage.setItem("fm_table", String(t));
  paintTables();
  paintPhones();
startResults();
  try {
    const res = await fetch(`${SERVER}/${TOPIC_BASE}-all`, { method: "POST", body: `__TABLE__${t}`, headers: authHeaders() });
    addLog(res.ok ? `✓ Tafel ${t} actief` : `✗ Tafel ${t} — HTTP ${res.status}`, res.ok ? "ok" : "err");
  } catch (e) {
    addLog(`✗ Tafel ${t} — ${e.message}`, "err");
  }
}
paintTables();

const phonesDiv = document.getElementById("phones");
function paintPhones() {
  const names = TABLES[activeTable - 1] || [];
  const chosen = new Set([...document.querySelectorAll(".phone:checked")].map(c => c.value));
  const allOn = document.getElementById("all").checked;
  phonesDiv.innerHTML = "";
  for (let i = 1; i <= PHONE_COUNT; i++) {
    const label = document.createElement("label");
    const name = names[i - 1] || "";
    label.innerHTML = `<input type="checkbox" class="phone" value="${i}">` +
      `<span class="num">${i}</span><span class="pname">${name}</span>`;
    const box = label.querySelector("input");
    box.checked = chosen.has(String(i));
    box.disabled = allOn;
    box.addEventListener("change", updateSelectionStyles);
    phonesDiv.appendChild(label);
  }
  updateSelectionStyles();
}

function updateSelectionStyles() {
  document.querySelectorAll(".phone").forEach(cb => {
    cb.closest("label")?.classList.toggle("selected", cb.checked);
  });
  document.querySelector(".all-label")?.classList.toggle("selected", document.getElementById("all").checked);
}

document.getElementById("all").addEventListener("change", (e) => {
  document.querySelectorAll(".phone").forEach(cb => { cb.checked = false; cb.disabled = e.target.checked; });
  updateSelectionStyles();
});

paintPhones();

const fileInput = document.getElementById("file");
const preview = document.getElementById("preview");
const previewVid = document.getElementById("previewvid");
const clearFileBtn = document.getElementById("clearfile");

function showFile(f) {
  preview.style.display = "none";
  previewVid.style.display = "none";
  previewVid.pause();
  clearFileBtn.hidden = !f;
  if (!f) {
    setFileInfo(null);
    return;
  }
  if (f.type.startsWith("video/")) {
    previewVid.src = URL.createObjectURL(f);
    previewVid.style.display = "block";
  } else {
    preview.src = URL.createObjectURL(f);
    preview.style.display = "block";
  }
  setFileInfo(f);
}

fileInput.addEventListener("change", () => showFile(fileInput.files[0]));

// Drop the attachment so a text-only secret can be sent without reloading.
clearFileBtn.addEventListener("click", () => {
  fileInput.value = "";
  preview.removeAttribute("src");
  previewVid.removeAttribute("src");
  showFile(null);
  addLog("Attachment removed.", "ok");
});

// RFC 2047 encoding for non-ASCII header values (ntfy decodes these).
// Chunk per 10 characters so each encoded-word stays short and never
// splits a multi-byte character.
function headerValue(text) {
  const clean = text.replace(/[\r\n]+/g, " ").trim();
  if (/^[\x20-\x7e]*$/.test(clean) && !clean.startsWith("=?")) return clean;
  const words = [];
  for (const chunk of clean.match(/.{1,10}/gs) || []) {
    const bytes = new TextEncoder().encode(chunk);
    words.push("=?UTF-8?B?" + btoa(String.fromCharCode(...bytes)) + "?=");
  }
  return words.join(" ");
}

const MAX_ATTACHMENT_BYTES = 25 * 1024 * 1024;   // Supporter tier
function formatBytes(bytes) {
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
  return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
}
function setFileInfo(file, detail = "") {
  const el = document.getElementById("fileInfo");
  if (!file) {
    el.textContent = "";
    el.className = "";
    return;
  }
  const sizeText = formatBytes(file.size);
  const isTooLarge = file.size > MAX_ATTACHMENT_BYTES;
  const detailText = detail ? ` • ${detail}` : "";
  el.textContent = `${file.name} • ${sizeText}${isTooLarge ? " • exceeds the 25 MB limit" : " • under the 25 MB limit"}${detailText}`;
  el.className = isTooLarge ? "err" : "ok";
}

function targets() {
  if (document.getElementById("all").checked) return [{ label: "All phones", topic: `${TOPIC_BASE}-all` }];
  return [...document.querySelectorAll(".phone:checked")]
    .map(cb => ({ label: `Phone ${cb.value}`, topic: `${TOPIC_BASE}-p${cb.value}` }));
}

const log = document.getElementById("log");
function addLog(msg, cls) {
  const line = document.createElement("div");
  line.textContent = msg;
  if (cls) line.className = cls;
  log.prepend(line);
}

document.getElementById("send").addEventListener("click", async () => {
  const text = document.getElementById("text").value.trim();
  let file = fileInput.files[0];
  const to = targets();

  if (to.length === 0) { addLog("⚠ Kies minstens één telefoon.", "err"); return; }
  if (!text && !file) { addLog("⚠ Kies een afbeelding/video of typ een tekst.", "err"); return; }

  const btn = document.getElementById("send");
  btn.disabled = true;
  btn.textContent = "Sending…";

  try {
    if (file && file.size > MAX_ATTACHMENT_BYTES) {
      addLog(`⚠ Bestand te groot — ${formatBytes(file.size)} is meer dan 25 MB.`, "err");
      btn.disabled = false;
      btn.textContent = "Send";
      return;
    }

    for (const t of to) {
      try {
        let res;
        if (file) {
          const headers = authHeaders({ "X-Filename": (file.name || "secret").replace(/[^\x20-\x7e]/g, "_") });
          if (text) headers["X-Message"] = headerValue(text);
          res = await fetch(`${SERVER}/${t.topic}`, { method: "PUT", body: file, headers });
        } else {
          res = await fetch(`${SERVER}/${t.topic}`, { method: "POST", body: text, headers: authHeaders() });
        }
        if (res.ok) addLog(`✓ ${t.label} — sent ${new Date().toLocaleTimeString()}`, "ok");
        else addLog(`✗ ${t.label} — HTTP ${res.status}`, "err");
      } catch (e) {
        addLog(`✗ ${t.label} — ${e.message}`, "err");
      }
    }
  } finally {
    btn.disabled = false;
    btn.textContent = "Send";
  }
});

// Admin: ask every phone for a fresh selfie at the start of a table's round.
document.getElementById("selfies").addEventListener("click", async () => {
  if (!confirm("Alle telefoons om een selfie vragen?")) return;
  try {
    const res = await fetch(`${SERVER}/${TOPIC_BASE}-all`, {
      method: "POST", body: "__SELFIE__", headers: authHeaders()
    });
    addLog(res.ok ? `✓ Selfies gevraagd ${new Date().toLocaleTimeString()}`
                  : `✗ Selfies — HTTP ${res.status}`, res.ok ? "ok" : "err");
  } catch (e) {
    addLog(`✗ Selfies — ${e.message}`, "err");
  }
});

// Admin: put every phone into the closing question, and watch the answers land.
document.getElementById("finalq").addEventListener("click", async () => {
  if (!confirm("Send the final question to ALL phones?")) return;
  try {
    const res = await fetch(`${SERVER}/${TOPIC_BASE}-all`, { method: "POST", body: "__FINALQUESTION__", headers: authHeaders() });
    if (res.ok) {
      addLog(`✓ Final question sent ${new Date().toLocaleTimeString()}`, "ok");
      startVoteRound();
      startResults();
    } else {
      addLog(`✗ Final question — HTTP ${res.status}`, "err");
    }
  } catch (e) {
    addLog(`✗ Final question — ${e.message}`, "err");
  }
});

// Phones publish their picks to the votes topic. This polls rather than using
// an EventSource: a stream only delivers what is published while it happens to
// be connected, so a vote cast before the page was opened - or anything sent
// during a reload or a dropped connection - was silently lost. Polling with
// `since` can't miss one.
const answers = new Map();
let votesPolling = false;

function startResults() {
  document.getElementById("resultsBox").hidden = false;
  renderResults();
  if (votesPolling) return;
  votesPolling = true;
  pollVotes();
  setInterval(pollVotes, VOTE_POLL_MS);
}

const VOTE_POLL_MS = 5000;
const VOTE_LOOKBACK = "6h";

// Answers belong to the round that is running. Asking the question (or starting
// a new round) moves this marker, so the previous sitting's picks can't reappear
// out of the topic history — including after a reload.
let votesSince = Number(localStorage.getItem("fm_votes_since") || 0);

function startVoteRound() {
  votesSince = Math.floor(Date.now() / 1000);
  localStorage.setItem("fm_votes_since", String(votesSince));
  answers.clear();
  renderResults();
}

async function pollVotes() {
  try {
    const since = votesSince || VOTE_LOOKBACK;
    const res = await fetch(
      `${SERVER}/${TOPIC_BASE}-votes/json?poll=1&since=${since}`,
      { headers: authHeaders() }
    );
    if (!res.ok) return;
    const text = await res.text();
    let changed = false;
    for (const line of text.split("\n")) {
      if (!line.trim()) continue;
      let m;
      try { m = JSON.parse(line); } catch (_) { continue; }
      if (m.event !== "message" || !m.message) continue;
      let payload;
      try { payload = JSON.parse(m.message); } catch (_) { continue; }
      if (typeof payload.phone !== "number") continue;
      if (payload.phone < 1 || payload.phone > PHONE_COUNT) continue;   // stray/test data
      if (votesSince && (m.time || 0) < votesSince) continue;
      // one answer per phone, the most recent wins
      const prev = answers.get(payload.phone);
      if (!prev || (m.time || 0) >= (prev._t || 0)) {
        payload._t = m.time || 0;
        answers.set(payload.phone, payload);
        changed = true;
      }
    }
    if (changed) renderResults();
  } catch (e) {
    // transient; the next tick tries again
  }
}

function renderResults() {
  const el = document.getElementById("results");
  el.innerHTML = "";
  // only the table in play — mixing sittings would be unreadable
  const forTable = [...answers.values()]
    .filter(a => !a.table || a.table === activeTable)
    .sort((a, b) => a.phone - b.phone);
  for (const a of forTable) {
    const names = (a.pickNames || []).join(", ");
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `<span class="who">${a.phone}${a.personName ? " " + a.personName : ""}</span>` +
      (names ? `<span class="picks">→ ${names}</span>` : `<span class="none">niemand gekozen</span>`);
    el.appendChild(row);
  }
  const missing = PHONE_COUNT - forTable.length;
  const row = document.createElement("div");
  row.className = "row waiting";
  row.textContent = missing > 0
    ? `wachten op ${missing} van de ${PHONE_COUNT} telefoons…`
    : `alle ${PHONE_COUNT} telefoons hebben gekozen`;
  el.appendChild(row);
}

// Admin: wipe the current message on every phone; they all return to the idle image.
// "__NEXTROUND__" is a control command understood by the app, not shown as a message.
document.getElementById("nextround").addEventListener("click", async () => {
  if (!confirm("Start the next round? This clears the message on ALL phones.")) return;
  try {
    const res = await fetch(`${SERVER}/${TOPIC_BASE}-all`, { method: "POST", body: "__NEXTROUND__", headers: authHeaders() });
    if (res.ok) {
      addLog(`✓ Next round — all phones cleared ${new Date().toLocaleTimeString()}`, "ok");
      startVoteRound();
    }
    else addLog(`✗ Next round — HTTP ${res.status}`, "err");
  } catch (e) {
    addLog(`✗ Next round — ${e.message}`, "err");
  }
});
</script>
</body>
</html>
